__include__: [
  '../dfine/dfine_hgnetv2_m_coco.yml',
  '../base/rtdetrplus.yml'
]

output_dir: ./outputs/rtdetrplus_hgnetv2_m_coco

teacher_model:
  type: "DINOv3TeacherModel"
  dinov3_repo_path: dinov3/
  dinov3_weights_path: pretrain/dinov3_vitb16_pretrain_lvd1689m.pth
  patch_size: 16
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

HybridEncoder:
  in_channels: [384, 768, 1536]
  depth_mult: 0.67
  distill_teacher_dim: 768

DFINETransformer:
  num_layers: 4
  use_moe_ffn: True
  moe_num_experts: 2
  moe_use_gating_residuals: True

RTDETRPlusCriterion:
  weight_dict:
    loss_distill: 5
  distill_adaptive_params:
    enabled: True
    rho: 3.5
    delta: 0.25
    default_weight: 15

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*bn).*$'
      lr: 0.00004
    -
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.0004
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epoches: 102

flat_epoch: 49
no_aug_epoch: 12

train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: [4, 49, 90]

  collate_fn:
    mixup_epochs: [4, 49]
    stop_epoch: 90
